name: Publish the live demo
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: corepack pnpm install --frozen-lockfile
            - run: corepack pnpm --filter website build:review
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: apps/website/dist/review

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.pages.outputs.page_url }}
        steps:
            - name: Publish
              id: pages
              uses: actions/deploy-pages@v4
